name: Godot — testar e publicar Web

on:
  push:
    branches: [main]
    paths:
      - 'godot/**'
      - '.github/workflows/godot-web.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: godot-web-main
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Godot 4.3 e templates Web
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y unzip
          curl -fL --retry 3 -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp
          sudo install -m 755 /tmp/Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          curl -fL --retry 3 -o /tmp/templates.tpz "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz"
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.3.stable/"
          godot --version

      - name: Importar recursos e validar projeto
        run: |
          cd godot
          godot --headless --path . --editor --import --quit
          godot --headless --path . --script res://tests/smoke.gd

      - name: Exportar versão Web
        run: |
          mkdir -p godot/build/web
          godot --headless --path godot --export-release "Web" "$GITHUB_WORKSPACE/godot/build/web/index.html"
          test -s godot/build/web/index.html
          test -s godot/build/web/index.wasm
          test -s godot/build/web/index.pck

      - name: Guardar versão compilada
        uses: actions/upload-artifact@v4
        with:
          name: cartas-godot-web
          path: godot/build/web/
          if-no-files-found: error

      - name: Publicar em godot-play (GitHub Pages)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p godot-play
          find godot-play -mindepth 1 -maxdepth 1 -type f -delete
          cp godot/build/web/* godot-play/
          touch godot-play/.nojekyll
          git add -f godot-play/
          if ! git diff --cached --quiet; then
            git commit -m "build: publicar protótipo Godot Web"
            git push origin HEAD:main
          fi
