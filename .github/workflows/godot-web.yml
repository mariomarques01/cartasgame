name: Godot — testar e publicar Web

on:
  push:
    branches: [main]
    paths:
      - 'godot/**'
      - '.github/workflows/godot-web.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: godot-web-main
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/abarichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Importar recursos e validar projeto
        run: |
          cd godot
          godot --headless --path . --editor --import --quit
          godot --headless --path . --quit-after 5

      - name: Exportar versão Web
        run: |
          mkdir -p godot/build/web
          godot --headless --path godot --export-release "Web" build/web/index.html
          test -s godot/build/web/index.html
          test -s godot/build/web/index.wasm
          test -s godot/build/web/index.pck

      - name: Guardar versão compilada
        uses: actions/upload-artifact@v4
        with:
          name: cartas-godot-web
          path: godot/build/web/
          if-no-files-found: error

      - name: Publicar em godot-play (GitHub Pages)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p godot-play
          find godot-play -mindepth 1 -maxdepth 1 -type f -delete
          cp godot/build/web/* godot-play/
          touch godot-play/.nojekyll
          git add -f godot-play/
          if ! git diff --cached --quiet; then
            git commit -m "build: publicar protótipo Godot Web"
            git push origin HEAD:main
          fi
